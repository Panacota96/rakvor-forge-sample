name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0. Leave empty to build a test package."
        required: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (static CRT, see .cargo/config.toml)
        run: cargo build --release --locked -p rv-hashinv-cli -p rv-hashinv-gui
      - name: Verify the build before packaging
        shell: pwsh
        run: |
          .\target\release\rv-hashinv.exe self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\examples\sample\run.ps1 -Bin .\target\release\rv-hashinv.exe
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'rv-hashinv-cli' | Select-Object -ExpandProperty version
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "rv-hashinv-${{ steps.v.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force dist\$name | Out-Null
          Copy-Item target\release\rv-hashinv.exe, target\release\rv-hashinv-gui.exe, README.md, LICENSE, NOTICE, CHANGELOG.md dist\$name
          Copy-Item -Recurse docs, examples dist\$name
          Remove-Item -Recurse -Force dist\$name\examples\sample\out -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\$name\* -DestinationPath dist\$name.zip
      - name: Installer (Inno Setup, preinstalled on windows-latest)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.v.outputs.version }} /DSourceDir=$PWD /O$PWD\dist packaging\windows\installer.iss
      - name: SBOM (CycloneDX)
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --spec-version 1.5
          Copy-Item src\cli\*.cdx.json dist\sbom.cdx.json
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum ./*.zip ./*.exe ./sbom.cdx.json > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.v.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
            dist/sbom.cdx.json
      - name: Attach to GitHub Release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip dist/*.exe dist/SHA256SUMS dist/sbom.cdx.json --clobber
