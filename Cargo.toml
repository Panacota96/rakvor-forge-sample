[workspace]
resolver = "3"
members = ["src/core", "src/cli", "src/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Rakvor"]
repository = "https://github.com/rakvor/rv-hashinv"

[workspace.dependencies]
rv-hashinv-core = { path = "src/core" }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1.8"
digest = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2.5"
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
indicatif = "0.18"
ctrlc = "3.5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17"
# Trust: RFC 3161 timestamps + PDF signatures (RustCrypto, pure Rust; versions aligned on der 0.7)
ureq = "3"
p12-keystore = "0.4"
cms = { version = "0.2", features = ["builder"] }
x509-tsp = "0.1"
x509-cert = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["alloc", "oid"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2-legacy = { package = "sha2", version = "0.10" }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols are kept (no strip, no UPX): packed or stripped binaries raise antivirus false positives.
