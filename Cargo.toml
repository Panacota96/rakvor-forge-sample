[workspace]
resolver = "3"
members = ["src/core", "src/cli", "src/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Rakvor"]
repository = "https://github.com/rakvor/rv-hashinv"

[workspace.dependencies]
rv-hashinv-core = { path = "src/core" }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1.8"
digest = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2.5"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
indicatif = "0.18"
ctrlc = "3.5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols are kept (no strip, no UPX): packed or stripped binaries raise antivirus false positives.
